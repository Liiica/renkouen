<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>クロノス</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0a09;
      --bg-soft: #14120f;
      --text: #ece6da;          /* 生成り色の文字 */
      --muted: #7d766a;
      --gold: #c9a45c;          /* 自分の役・装飾の金 */
      --gold-soft: rgba(201, 164, 92, 0.35);
      --hairline: rgba(201, 164, 92, 0.18);
      --direction: #a39c8e;     /* ト書きの色 */
      --serif-jp: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
      --serif-en: "Cormorant Garamond", "Times New Roman", serif;
      /* 1行の高さ：画面の高さからバー等を引いて20等分 */
      --rows: 20;
      --row: calc((100vh - 150px) / var(--rows));
      --fs: clamp(12px, calc(var(--row) * 0.5), 20px);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      font-family: var(--serif-jp);
      /* 舞台のスポットライトのような光 */
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(201, 164, 92, 0.10), transparent 70%),
        radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.6) 100%),
        var(--bg);
      background-attachment: fixed;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* 上部バー */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      padding: 10px 32px;
      background: linear-gradient(to bottom, rgba(11, 10, 9, 0.96), rgba(11, 10, 9, 0.85));
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--hairline);
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-right: auto;
    }
    .play-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.35em;
      color: var(--text);
    }
    .current-page {
      font-family: var(--serif-en);
      font-style: italic;
      font-size: 17px;
      color: var(--gold);
      letter-spacing: 0.08em;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--serif-en);
      font-size: 13px;
      letter-spacing: 0.15em;
      color: var(--muted);
    }
    .controls label { display: flex; align-items: center; gap: 8px; }
    header select, header button {
      appearance: none;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--gold-soft);
      border-radius: 0;
      padding: 5px 12px;
      font-family: var(--serif-jp);
      font-size: 13px;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    header select { padding-right: 28px;
      background-image: linear-gradient(45deg, transparent 50%, var(--gold) 50%),
                        linear-gradient(135deg, var(--gold) 50%, transparent 50%);
      background-position: calc(100% - 14px) 50%, calc(100% - 10px) 50%;
      background-size: 4px 4px;
      background-repeat: no-repeat;
    }
    header select option { background: var(--bg-soft); }
    header button:hover, header select:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* 台本エリア */
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 8px 32px 50vh;
      min-height: 100vh;
      cursor: pointer;
    }

    /* ① ページ数：飾り罫 */
    .page {
      display: flex;
      align-items: center;
      gap: 18px;
      height: var(--row);
      margin: 0;
      font-family: var(--serif-en);
      font-style: italic;
      font-size: calc(var(--fs) * 0.8);
      letter-spacing: 0.2em;
      color: var(--gold);
    }
    .page::before, .page::after {
      content: "";
      flex: 1;
      height: 1px;
    }
    .page::before { background: linear-gradient(to right, transparent, var(--gold-soft)); }
    .page::after  { background: linear-gradient(to left,  transparent, var(--gold-soft)); }

    /* ② セリフ */
    .line {
      display: grid;
      grid-template-columns: 7.5em 1fr;
      align-items: center;
      gap: 20px;
      min-height: var(--row);
      padding: 2px 0;
      border-bottom: 1px solid rgba(236, 230, 218, 0.04);
      font-size: var(--fs);
      line-height: 1.5;
      letter-spacing: 0.04em;
    }
    .line .role {
      font-size: 0.72em;
      letter-spacing: 0.25em;
      color: var(--muted);
      text-align: right;
      border-right: 1px solid var(--hairline);
      padding-right: 20px;
    }
    .line.mine .role { color: var(--gold); border-right-color: var(--gold); }
    .line.mine .text {
      color: #f6efe0;
      text-shadow: 0 0 18px rgba(201, 164, 92, 0.25);
    }

    /* ③ ト書き：中央寄せ・小さめ・括弧で区別 */
    .direction {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: var(--row);
      margin: 0 auto;
      max-width: 40em;
      text-align: center;
      font-size: calc(var(--fs) * 0.78);
      line-height: 1.5;
      letter-spacing: 0.12em;
      color: var(--direction);
    }

    .direction .paren { color: var(--gold-soft); }

    /* 表示時のアニメーション */
    .item { animation: fadeIn 0.6s cubic-bezier(0.2, 0.7, 0.2, 1); }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); filter: blur(3px); }
      to   { opacity: 1; transform: none; filter: none; }
    }

    .hint {
      margin-top: 12px;
      text-align: center;
      font-family: var(--serif-en);
      font-style: italic;
      font-size: 14px;
      letter-spacing: 0.2em;
      color: var(--muted);
      animation: breathe 3s ease-in-out infinite;
    }
    .hint.end { color: var(--gold); animation: none; font-size: 18px; }
    @keyframes breathe { 50% { opacity: 0.4; } }

    @media (max-width: 560px) {
      header { padding: 14px 16px; gap: 12px; }
      main { padding: 24px 16px 200px; }
      :root { --fs: clamp(12px, calc(var(--row) * 0.45), 16px); }
      .line { grid-template-columns: 4.5em 1fr; gap: 10px; }
      .line .role { padding-right: 8px; letter-spacing: 0.05em; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="play-title" id="playTitle"></span>
      <span class="current-page" id="currentPage">Page —</span>
    </div>
    <div class="controls">
      <label>ROLE
        <select id="myRole"></select>
      </label>
      <button id="backBtn">戻る</button>
      <button id="resetBtn">最初から</button>
    </div>
  </header>

  <main id="stage">
    <div id="script"></div>
    <p class="hint" id="hint">click to continue</p>
  </main>

  <script>
    // ============================================
    // ここに台本を書きます
    //   ページ数 → { type: "page", num: 1 }
    //   セリフ   → { type: "line", role: "役名", text: "セリフ" }
    //   ト書き   → { type: "direction", text: "ト書き" }
    // ============================================
    const script = [
      { type: "page", num: 14 },
      { type: "line", role: "吹原", text: "こんにちは" },
      { type: "direction", text: "圭がやってくる。" },
      { type: "line", role: "圭", text: "いらっしゃいませ。贈り物ですか？" },
      { type: "line", role: "吹原", text: "え？いや……。" },
      { type: "line", role: "圭", text: "その様子だとお花を買うのは初めてですね？良かったら、私が適当に選びましょうか？" },
      { type: "line", role: "吹原", text: "その、実は……。" },
      { type: "line", role: "圭", text: "で、予算は？" },
      { type: "line", role: "吹原", text: "千円、いや、五千円で。" },
      { type: "line", role: "圭", text: "了解しました。" },
      { type: "direction", text: "圭が去る。" },
      { type: "line", role: "中林", text: "おまえ、彼女に会いに行ったつじゃなかとや！" },
      { type: "line", role: "吹原", text: "言えなかったんですよ。いきなり来美子さんに会いに来たって言ったら、なんて思われるか。それに、彼女が僕を覚えてなかったら。" },
      { type: "line", role: "海老名", text: "覚えてますよ。だって、中二から高三まで、五年も同じ学校に通ってたんでしょう？" },
      { type: "line", role: "吹原", text: "でも、同じクラスになったのは中二の時だけだったし。" },
      { type: "direction", text: "圭がやってくる。花束を吹原に差し出して、" },
      { type: "line", role: "圭", text: "お待たせしました。これでいかがですか？" },
      { type: "line", role: "吹原", text: "はあ……。" },
      { type: "line", role: "圭", text: "お代は一万円になります。" },
      { type: "line", role: "吹原", text: "え？" },
      { type: "line", role: "圭", text: "嘘嘘。五千円です。でも、見た目は一万円に見えるでしょう？" },
      { type: "line", role: "吹原", text: "ちょっと待ってください。今、出しますから。(とポケットから財布を取り出す)" },
      { type: "page", num: 15 },
      { type: "direction", text: "来美子が箱を持ってやってくる。" },
      { type: "line", role: "来美子", text: "圭ちゃん、私、店長と配達に行ってくるね。お留守番、お願い。" },
      { type: "line", role: "圭", text: "わかりました。行ってらっしゃい。" },
      { type: "line", role: "吹原", text: "(海老名に)彼女でした。札幌に転校してから十年。やっと会うことができました。(来美子に)あの。" },
      { type: "line", role: "来美子", text: "え？" },
      { type: "line", role: "吹原", text: "(紙を差し出して)これ、代金です。" },
      { type: "line", role: "圭", text: "お客さん、それはこちらに。" },
      { type: "line", role: "吹原", text: "(来美子に)これ。" },
      { type: "line", role: "来美子", text: "(紙を受け取って)これ、居酒屋のレシートですけど。" },
      { type: "line", role: "吹原", text: "え？あっ！(と来美子の手から紙をひったくって)これは昨夜、会社の同僚と行った時に。うっ！(と財布を落とし、右手の手首を押さえる)" },
      { type: "line", role: "来美子", text: "大丈夫ですか？(と財布を拾う)" },
      { type: "line", role: "吹原", text: "あ、すみません。(と財布に手を伸ばす)" },
      { type: "line", role: "来美子", text: "(吹原の手を避けて)吹原君でしょう？" },
      { type: "line", role: "吹原", text: "え？" },
      { type: "line", role: "来美子", text: "熊本県立水前寺高校三年三組、吹原和彦君でしょう？" },
      { type: "line", role: "吹原", text: "……うん。" },
      { type: "line", role: "圭", text: "(来美子に)え？嘘。知り合い？" },
      { type: "line", role: "来美子", text: "高校の時の同級生。(吹原に)十年ぶりよね。でも、全然変わってない。" },
      { type: "line", role: "吹原", text: "蕗さんも。" },
      { type: "line", role: "来美子", text: "でも、どうしてここに？" },
      { type: "line", role: "吹原", text: "さっき、病院で頼人に会って。知らなかったよ。蕗さんが横浜にいたなんて。" },
      { type: "line", role: "来美子", text: "吹原君も横浜に？" },
      { type: "line", role: "吹原", text: "会社がすぐ近くなんだ。歩いて、10分もかからない。" },
      { type: "line", role: "来美子", text: "信じられない。そんなに近くにいたなんて。" },
      { type: "page", num: 16 },
      { type: "direction", text: "辻堂が箱を持ってやってくる。" },
      { type: "line", role: "辻堂", text: "来美ちゃん。お待たせ。" },
      { type: "line", role: "来美子", text: "はい。(吹原に)これから、配達なんだ。良かったら、また来て。" },
      { type: "line", role: "吹原", text: "うん。" },
      { type: "direction", text: "辻堂と来美子が去る。" },
      { type: "line", role: "圭", text: "お客さん、お代は？" },
      { type: "line", role: "吹原", text: "財布は今、蕗さんが。" },
      { type: "line", role: "圭", text: "え？来美子さん！" },
      { type: "direction", text: "圭が走り去る。" },
      { type: "line", role: "中林", text: "おまえもドジばってん、来美ちゃんはもっとやね。" },
      { type: "line", role: "吹原", text: "来美ちゃんなんて呼ばないでください。会ったこともないくせに。" },
      { type: "line", role: "海老名", text: "でも、私の言ってた通りでしたね。あなたのこと、ちゃんと覚えてた。" },
      { type: "line", role: "吹原", text: "次の日から、僕はシック・ブーケに通い始めました。さすがに毎日ってわけには行かなかったけど、週に一度。おかげで、花には随分詳しくなりました。" },
      { type: "direction", text: "吹原がギプスを取る。圭がやってくる。" },
      { type: "line", role: "吹原", text: "あの、蕗さんは？" },
      { type: "page", num: 17 },
      { type: "line", role: "圭", text: "今、配達。そろそろ帰ってくると思うけど。" },
      { type: "line", role: "吹原", text: "店長も一緒？" },
      { type: "line", role: "圭", text: "何よ。吹原さん、ヤキモチ焼いてるの？" },
      { type: "line", role: "吹原", text: "いや、僕は別に。" },
      { type: "line", role: "圭", text: "隠しても無駄。毎週お花を買いに来るのは、来美子さんに会うためでしょう？でも、気を付けた方がいいよ。吹原さんみたいな人は、他に三十人以上いるから。" },
      { type: "line", role: "吹原", text: "ええっ！？そんなに？！" },
      { type: "direction", text: "来美子と辻堂が箱をもってやってくる。" },
      { type: "line", role: "辻堂", text: "ただいま。" },
      { type: "line", role: "来美子", text: "吹原君、今日は何にする？" },
      { type: "line", role: "辻堂", text: "来美ちゃん、これ、片付けといて。(と箱を差し出して)こちらの相手は俺がするから。" },
      { type: "line", role: "来美子", text: "はい。(と受け取って、吹原に)じゃあね。" },
      { type: "direction", text: "来美子が去る。" },
      { type: "line", role: "辻堂", text: "で、今日は何を。" },
      { type: "line", role: "吹原", text: "いや、また今度来ます。" },
      { type: "line", role: "辻堂", text: "そう言わずに、何か買ってってくださいよ。サービスしますから。" },
      { type: "line", role: "吹原", text: "じゃ、その辺のを適当に。" },
      { type: "line", role: "辻堂", text: "圭ちゃん、カサブランカ、十本。" },
      { type: "line", role: "吹原", text: "十本？" },
      { type: "line", role: "辻堂", text: "少ないですか？(圭に)じゃ、二十本。" },
      { type: "line", role: "圭", text: "吹原さんに持ちきれるかしら。" },
      { type: "direction", text: "圭と辻堂が去る。頼人がやってくる。" },
      { type: "page", num: 23 },
      { type: "line", role: "吹原", text: "大きなタンクローリーが、シック・ブーケの前で燃えていました。頭を店の中に突っこんで。店は前半分が潰れ、残りの半分は炎に包まれていました。" },
      { type: "direction", text: "圭がやってくる。" },
      { type: "line", role: "吹原", text: "圭さん大丈夫ですか！？" },
      { type: "line", role: "圭", text: "あ、吹原さん。私と店長は、近所に配達に行ってて、無事だったんですけど。" },
      { type: "line", role: "吹原", text: "来美子さんは！？" },
      { type: "line", role: "圭", text: "救急車で病院へ。店長も一緒です。" },
      { type: "line", role: "吹原", text: "ありがとう。(と走り出そうとする)" },
      { type: "line", role: "圭", text: "吹原さん、これ。(とカエルのブローチを差し出す)" },
      { type: "line", role: "吹原", text: "(受け取って)昨日、プレゼントしたカエルのブローチでした。半分溶けていました。" },
      { type: "direction", text: "圭が去る。頼人と辻堂がやってくる。辻堂は煤で汚れている。" },
      { type: "page", num: 33 },
      { type: "line", role: "吹原", text: "冗談なんかじゃない！ここに書いてあることは、これから本当に起こることなんだ。" },
      { type: "line", role: "来美子", text: "これから起こることが、どうして記事になってるの？こんなもの、どうして吹原君が持ってるの？" },
      { type: "line", role: "吹原", text: "僕は未来から来たんだ。" },
      { type: "line", role: "来美子", text: "未来から？そんなことがどうしてできるのよ。" },
      { type: "line", role: "吹原", text: "今、うちの会社は、物質を過去に飛ばす機械を開発している。名前はクロノス・ジョウンター。その機械の力で、来たんだ。" },
      { type: "line", role: "来美子", text: "クロノス・ジョウンター……。" },
      { type: "direction", text: "辻堂と圭がやってくる。二人とも箱を持っている。" },
      { type: "line", role: "辻堂", text: "来美ちゃん。俺、圭ちゃんと馬車道ホテルに行ってくるから。" },
      { type: "line", role: "圭", text: "(来美子に)留守番、お願いしますね。" },
      { type: "line", role: "吹原", text: "行こう、蕗さん！" },
      { type: "line", role: "来美子", text: "でも、私、ここにいないと。" },
      { type: "line", role: "吹原", text: "そんなことを言ってる場合じゃないんだ。さあ。(と来美子の手を掴む)" },
      { type: "line", role: "圭", text: "どうしたのよ、吹原さん。興奮しちゃって。" },
      { type: "line", role: "吹原", text: "何でもない。さあ、蕗さん。(と来美子の手を引っ張る)" },
      { type: "line", role: "来美子", text: "でも。" },
      { type: "line", role: "辻堂", text: "(吹原の肩を掴んで)吹原さん。来美ちゃんは今、仕事中なんですよ。" },
      { type: "line", role: "吹原", text: "(辻堂の手を振り払って)あなたは黙っててください！" },
      { type: "line", role: "辻堂", text: "そう言われても、彼女はうちの従業員ですからね。勝手に連れて行かれたら、困る。" },
      { type: "line", role: "圭", text: "(来美子に)何か合ったの？" },
      { type: "line", role: "来美子", text: "(吹原を示して)この人が、この店で事故が起こるって。" },
      { type: "line", role: "圭", text: "いつ？" },
      { type: "line", role: "吹原", text: "31分後、(時計を見て)いや27分後です。だから、早く外へ行かないと。(と来美子の手を掴む)" },
      { type: "line", role: "辻堂", text: "悪いけど、出ていってくれませんか！？" },
      { type: "page", num: 34 },
      { type: "line", role: "吹原", text: "頼む、彼女も一緒に—―" },
      { type: "direction", text: "吹原がよろめく" },
      { type: "line", role: "来美子", text: "どうしたの、吹原君？" },
      { type: "line", role: "吹原", text: "まただ。また風が……。" },
      { type: "line", role: "来美子", text: "(吹原の腕を掴んで)吹原君、しっかりして。" },
      { type: "line", role: "吹原", text: "また来る……。必ず来る……。" },
      { type: "line", role: "来美子", text: "吹原君！" },
      { type: "direction", text: "吹原が倒れる。来美子・圭・辻堂が去る" },
      { type: "page", num: 52 },
      { type: "line", role: "吹原", text: "パン屋の角を曲がると、大きな通りに出ました。遠くにシック・ブーケが見えました！" },
      { type: "line", role: "中林", text: "走れ、吹原！" },
      { type: "line", role: "吹原", text: "あと50メートル、と思った時、目の前に、辻堂さんと圭さんが" },
      { type: "direction", text: "辻堂と圭が箱を持ってやってくる。" },
      { type: "line", role: "圭", text: "吹原さん！" },
      { type: "line", role: "辻堂", text: "(吹原に)あんた、どうしてここにいるんだ？" },
      { type: "line", role: "吹原", text: "そこをどいてください。" },
      { type: "line", role: "圭", text: "急にいなくなったから、ビックリしちゃった。いつの間に、外に出たの？" },
      { type: "line", role: "吹原", text: "そこをどいてください。" },
      { type: "direction", text: "吹原が圭を突き飛ばす。辻堂が吹原の腕をつかんで、" },
      { type: "line", role: "辻堂", text: "どこに行くんです？" },
      { type: "line", role: "吹原", text: "放してくれ。" },
      { type: "line", role: "辻堂", text: "また来美ちゃんにちょっかいを出すつもりですか？吹原さん、あなた、ちょっとおかしいですよ。" },
      { type: "line", role: "吹原", text: "何とでも言ってくれ。僕は彼女を助けたいだけなんだ。" },
      { type: "line", role: "辻堂", text: "いい加減にしろよ！" },
      { type: "direction", text: "辻堂が吹原を突き飛ばす。吹原が跪く。" },
      { type: "page", num: 53 },
      { type: "line", role: "辻堂", text: "何が彼女を助けたいだ。あんたのおかげで、来美ちゃんや俺たちがどれだけ迷惑してるのかわからないのか？" },
      { type: "direction", text: "吹原が立ち上がり、歩き出す。辻堂が吹原の肩をつかみ、引き戻す。吹原が倒れる。" },
      { type: "line", role: "辻堂", text: "うちの店には二度と来ないでくれ！" },
      { type: "line", role: "吹原", text: "頼む。行かせてくれ。" },
      { type: "line", role: "辻堂", text: "聞こえないのか？うちの店には二度と—――" },
      { type: "line", role: "圭", text: "ねえ、吹原さん、どうしちゃったの？あなたはこんなことする人じゃなかったじゃない。" },
      { type: "line", role: "吹原", text: "頼む！" },
      { type: "line", role: "圭", text: "来美子さんのことが本当に好きなら、今日は帰って。明日は店がお休みだから、来美子さんも暇だと思うし。" },
      { type: "line", role: "吹原", text: "明日じゃ駄目なんだ！" },
      { type: "line", role: "圭", text: "吹原さん？" },
      { type: "line", role: "吹原", text: "今、行かなければ、意味がないんだ。明日は永遠にやってこないんだ！！" },
      { type: "direction", text: "吹原が立ち上がる。が、よろめく。" },
      { type: "line", role: "中林", text: "吹原！" },
      { type: "line", role: "吹原", text: "まだだ。俺はまだ戻らないぞ。" },
      { type: "line", role: "圭", text: "吹原さん、誰に向かって、話してるの？" },
      { type: "line", role: "吹原", text: "彼女に会うまでは戻らない。絶対に戻らない！" },
      { type: "line", role: "圭", text: "吹原さん！" },
      { type: "direction", text: "吹原が倒れる(飛ばされる)。圭と辻堂が去る。" },
    ];

    const scriptEl = document.getElementById("script");
    const currentPageEl = document.getElementById("currentPage");
    const myRoleEl = document.getElementById("myRole");
    const hintEl = document.getElementById("hint");

    let index = 0; // 次に表示する項目の番号

    // 役名の選択肢を台本から自動で作る
    const roles = [...new Set(script.filter(s => s.type === "line").map(s => s.role))];
    myRoleEl.innerHTML = '<option value="">（なし）</option>' +
      roles.map(r => `<option value="${r}">${r}</option>`).join("");

    function createItem(item) {
      const el = document.createElement("div");
      el.classList.add("item", item.type);
      if (item.type === "page") {
        el.textContent = `Page ${item.num}`;
      } else if (item.type === "line") {
        el.dataset.role = item.role;
        if (item.role === myRoleEl.value) el.classList.add("mine");
        el.innerHTML = `<span class="role"></span><span class="text"></span>`;
        el.querySelector(".role").textContent = item.role;
        el.querySelector(".text").textContent = item.text;
      } else {
        el.innerHTML = `<span><span class="paren">（</span><span class="dtext"></span><span class="paren">）</span></span>`;
        el.querySelector(".dtext").textContent = item.text;
      }
      return el;
    }

    function updatePageLabel() {
      // 表示済みの中で一番新しいページ数を上部に出す
      const shown = script.slice(0, index).filter(s => s.type === "page");
      currentPageEl.textContent = shown.length ? `Page ${shown[shown.length - 1].num}` : "Page —";
      const finished = index >= script.length;
      hintEl.textContent = finished ? "— Fin —" : "click to continue";
      hintEl.classList.toggle("end", finished);
    }

    // 次へ：ページ数は次のセリフ／ト書きと一緒に自動で出す
    function next() {
      if (index >= script.length) return;
      do {
        scriptEl.appendChild(createItem(script[index]));
        index++;
      } while (index < script.length && script[index - 1].type === "page");
      updatePageLabel();
      hintEl.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    // 戻る：直前の1項目を消す（ページ数だけ残らないようにする）
    function back() {
      if (index === 0) return;
      do {
        scriptEl.lastChild.remove();
        index--;
      } while (index > 0 && script[index - 1].type === "page");
      updatePageLabel();
    }

    function reset() {
      scriptEl.innerHTML = "";
      index = 0;
      updatePageLabel();
      window.scrollTo(0, 0);
    }

    // 自分の役を変えたら、表示済みのセリフの色も切り替える
    myRoleEl.addEventListener("change", () => {
      document.querySelectorAll(".line").forEach(el => {
        el.classList.toggle("mine", el.dataset.role === myRoleEl.value);
      });
    });

    document.getElementById("stage").addEventListener("click", next);
    document.getElementById("backBtn").addEventListener("click", back);
    document.getElementById("resetBtn").addEventListener("click", reset);

    document.addEventListener("keydown", e => {
      if (e.target.tagName === "SELECT") return;
      if (e.key === " " || e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); next(); }
      if (e.key === "ArrowLeft" || e.key === "Backspace") { e.preventDefault(); back(); }
    });

    document.getElementById("playTitle").textContent = document.title;
    updatePageLabel();
  </script>

</body>
</html>
